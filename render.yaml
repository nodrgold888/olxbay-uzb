databases:
  - name: olxbay-db
    plan: free
    databaseName: olxbay
    user: olxbay

services:
  - type: web
    name: olxbay-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olxbay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

  - type: web
    runtime: static
    name: olxbay-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://olxbay-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
